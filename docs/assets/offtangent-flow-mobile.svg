<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 636" width="360" height="636" role="img" aria-labelledby="mttl mdsc">
  <title id="mttl">Say it once — it ends up where you will look for it</title>
  <desc id="mdsc">A spoken thought is stored first, without a destination. A small router model then proposes where it belongs: it lands in the thread you already have, or it becomes its own thread and asks you, or it waits unsorted in the tray. Nothing is thrown away, every decision is reversible with one tap.</desc>
  <rect width="360" height="636" rx="16" fill="#0d1017"/>
  <rect x="0.5" y="0.5" width="359" height="635" rx="16" fill="none" stroke="#2b3240"/>

  <text x="22" y="38" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4f7fb">Say it once.</text>
  <text x="22" y="64" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#f4f7fb">It ends up where you look.</text>

  <!-- capture -->
  <rect x="22" y="80" width="316" height="110" rx="13" fill="#161b24" stroke="#38404f"/>
  <text x="40" y="106" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.1" fill="#8b96a8">YOU, HANDS FULL</text>
  <text x="40" y="134" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#e8ecf3">&#8220;Sintered brake pads,</text>
  <text x="40" y="158" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#e8ecf3">not the resin ones.&#8221;</text>
  <text x="40" y="180" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#7f8a9c">no thread picked yet</text>

  <path d="M180 190 V 208" stroke="#4b5666" stroke-width="2" fill="none"/>
  <path d="M180 210 l -6 -10 h 12 z" fill="#4b5666"/>

  <!-- router -->
  <rect x="22" y="212" width="316" height="72" rx="13" fill="#141b26" stroke="#3b6ea8"/>
  <text x="40" y="240" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#cfe0f5">Router &#183; a small model</text>
  <text x="40" y="266" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#8fa6c2">proposes a place, notes why</text>

  <path d="M180 284 V 302" stroke="#4b5666" stroke-width="2" fill="none"/>
  <path d="M180 304 l -6 -10 h 12 z" fill="#4b5666"/>

  <!-- outcome 1 -->
  <rect x="22" y="306" width="316" height="86" rx="12" fill="#12211a" stroke="#2f6b4d"/>
  <circle cx="44" cy="334" r="7" fill="#57c785"/>
  <text x="62" y="340" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#d9f2e4">It joins your thread</text>
  <text x="44" y="366" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#9fc5b1">&#8220;Rear brake rubbing&#8221; &#183; 0.91</text>

  <!-- outcome 2 -->
  <rect x="22" y="402" width="316" height="86" rx="12" fill="#211d12" stroke="#7a5c25"/>
  <circle cx="44" cy="430" r="7" fill="#e5a94a"/>
  <text x="62" y="436" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#f6e6c8">Not sure? It asks</text>
  <text x="44" y="462" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#cbb289">own thread, plus a review card</text>

  <!-- outcome 3 -->
  <rect x="22" y="498" width="316" height="86" rx="12" fill="#171a21" stroke="#3b4353"/>
  <circle cx="44" cy="526" r="7" fill="#8b96a8"/>
  <text x="62" y="532" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" fill="#e2e7ef">Fits nothing? It waits</text>
  <text x="44" y="558" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#98a2b3">unsorted beats wrongly sorted</text>

  <text x="22" y="612" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#69748a">Every decision stays reversible.</text>
</svg>
